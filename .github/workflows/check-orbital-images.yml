name: Check orbital images

# Temporary on this branch: saves the challenge page for review.
on:
  workflow_dispatch:
    inputs:
      preview_size:
        description: unused on this branch
        default: '0'
      only:
        description: unused on this branch
        default: ''

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install --quiet numpy xarray zarr fsspec aiohttp requests
      - run: pip install --quiet pillow
      - run: python3 scripts/build_discover.py
      - run: python3 scripts/check_discover.py
      - name: Commit the snapshot to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenge-snapshot public/discover
          git commit -m "Discover grid" || echo "nothing to commit"
          git push
