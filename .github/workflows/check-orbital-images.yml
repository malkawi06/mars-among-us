name: Check orbital images

# Temporary on this branch: saves the challenge page for review.
on:
  workflow_dispatch:
    inputs:
      preview_size:
        description: unused on this branch
        default: '0'
      only:
        description: unused on this branch
        default: ''

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/read_challenge.mjs
      - name: Commit the snapshot to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenge-snapshot
          git commit -m "Challenge page snapshot" || echo "nothing to commit"
          git push
