name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Satellite images of the Earth analog sites, scanned by the model on the Analyze page.
      # Optional: if EOX is unreachable the page explains the images are missing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and scan Earth satellite images
        continue-on-error: true
        run: |
          pip install --quiet pillow numpy onnxruntime
          python scripts/fetch_earth_images.py
          python scripts/scan_earth_images.py
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages answers unknown paths with 404.html; make it the app so /compare etc. survive a refresh.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
