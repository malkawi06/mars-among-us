name: Check LROC Moon images

# Manual check only: builds the close-up Moon images from the LROC Artemis III mosaics and uploads
# them as an artifact. It does not deploy anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow numpy rasterio pyproj
      - run: python scripts/lroc_roi.py moon-check
      # Small previews in the log, for reviewers who cannot download the artifact.
      - name: Print previews
        run: |
          python - <<'EOF'
          import base64, io, pathlib
          from PIL import Image
          for path in sorted(pathlib.Path('moon-check').glob('*.jpg')):
              buffer = io.BytesIO()
              Image.open(path).resize((256, 256)).save(buffer, 'JPEG', quality=70)
              print(f'PREVIEW {path.stem} {base64.b64encode(buffer.getvalue()).decode()}')
          EOF
      - uses: actions/upload-artifact@v5
        with:
          name: moon-check
          path: moon-check
